shop_keeper_task:
  description: >
    Think of the most relevant information about {topic} that a shop keeper would need to know to create an inventory for a store that sells items related to {topic}. List the information in bullet points.
  expected_output: >
    A list with 10 bullet points of items to sell, each one with a brief description of the item and its relevance to {topic}. Additionally, next to the name there should be a price for the item in gold coins.
  agent: shop_keeper

marketing_task:
  description: >
    Think of the most relevant information about {topic} that a marketing specialist would need to know to create a marketing strategy to promote products related to {topic}. List the information in bullet points.
  expected_output: >
    A list with 10 bullet points of the most relevant information about {topic} for marketing purposes.
  agent: marketing_specialist
